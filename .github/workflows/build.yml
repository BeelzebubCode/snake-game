name: Build LexiSnake (Windows, macOS, Linux)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: LexiSnake-Windows-x64
            archive: LexiSnake-Windows-x64.zip
          - os: macos-15
            artifact: LexiSnake-macOS-arm64
            archive: LexiSnake-macOS-arm64.zip
          - os: macos-15-intel
            artifact: LexiSnake-macOS-x64
            archive: LexiSnake-macOS-x64.zip
          - os: ubuntu-22.04
            artifact: LexiSnake-Linux-x64
            archive: LexiSnake-Linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Check Python syntax
        run: python -m compileall -q src main.py build_game.py

      - name: Build and validate executable and bundled assets
        run: python build_game.py --skip-install --archive

      - name: Upload native download
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
